<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Suppress benign Vite HMR WebSocket errors in AI Studio iframe environment -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Mock WebSocket for vite-hmr so @vite/client never fires a connection error in iframe
        if (window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          class MockHMRSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = url;
              this.protocols = protocols;
              this.readyState = 1; // WebSocket.OPEN
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = 'vite-hmr';
              setTimeout(() => {
                const openEvent = new Event('open');
                this.dispatchEvent(openEvent);
                if (typeof this.onopen === 'function') this.onopen(openEvent);
              }, 10);
            }
            send() {}
            close() {
              this.readyState = 3;
              const closeEvent = new CloseEvent('close', { wasClean: true });
              this.dispatchEvent(closeEvent);
              if (typeof this.onclose === 'function') this.onclose(closeEvent);
            }
          }

          window.WebSocket = function(url, protocols) {
            const isVite = (typeof protocols === 'string' && protocols.includes('vite')) ||
                          (Array.isArray(protocols) && protocols.some(p => p && p.includes('vite'))) ||
                          (typeof url === 'string' && url.includes('token='));
            if (isVite) {
              return new MockHMRSocket(url, protocols);
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Global error handlers to prevent error reporting to parent frame
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
            (event.filename && event.filename.includes('@vite/client'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (typeof event.reason === 'string' && (event.reason.includes('WebSocket') || event.reason.includes('vite'))) ||
            (event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))) ||
            (event.reason.stack && event.reason.stack.includes('@vite/client'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Filter console.error from triggering alerts about Vite WebSocket
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.some(arg => {
            if (typeof arg === 'string' && (arg.includes('WebSocket') || arg.includes('[vite]'))) return true;
            if (arg instanceof Error && (arg.message.includes('WebSocket') || arg.stack?.includes('@vite/client'))) return true;
            return false;
          })) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
    
    <title>D'Santos Perfumería</title>
    <meta name="description" content="Boutique de belleza, perfumería Fraiche, perfumes originales, cosméticos y cuidado personal con catálogo interactivo, pedidos por WhatsApp y gestión de inventario." />
